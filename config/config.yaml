# config.yaml - Konfigurasi Hermes Agent SD/MI (Hybrid Model & Telegram Gateway)

system:
  name: "fatimah-bot-brain"
  institution_type: "Sekolah Dasar / Madrasah Ibtidaiyah"
  version: "0.21.0-pantheon"
  timezone: "Asia/Jakarta"
  default_locale: "id-ID"
  state_dir: "~/.hermes"
  checkpoints_dir: "~/.hermes/checkpoints"
  kanban_dir: "~/.hermes/kanban"
  skills_dir: "./skills"

orchestrator:
  root_profile: "pamong-utama"
  default_operator_name: "Dr. Fatimah"
  budget_warning_ratio: 0.90
  max_peer_iterations: 3
  enable_bot_mode: true
  enable_swarm: true
  approval_workflow: "two_tier_human_in_the_loop"

# Arsitektur Model Berjenjang Hibrida (Groq + DeepSeek / OpenRouter + Local Fallback)
profiles:
  pamong-utama:
    model: "deepseek/deepseek-chat" # DeepSeek V3 via OpenRouter / DeepSeek API (Hemat & Bernalar Kuat)
    fallback_model: "anthropic/claude-sonnet-4"
    local_fallback: "ollama/qwen2.5:14b"
    reasoning_mode: "hybrid"
    temperature: 0.3
    context_window: 131072
    toolsets:
      - "kanban_create"
      - "hermes_peer"
      - "delegate_task"
      - "telegram_bot_gateway"

  kurikulum-guru:
    model: "deepseek/deepseek-reasoner" # DeepSeek R1 / V3 untuk perancangan Modul Ajar SD mendalam
    fallback_model: "nousresearch/hermes-4-70b"
    local_fallback: "ollama/qwen2.5:14b"
    reasoning_mode: "true"
    temperature: 0.6
    context_window: 131072
    toolsets:
      - "skill_manage"
      - "markdown_compiler"
      - "filesystem"
      - "hermes_peer"

  tata-usaha:
    model: "groq/llama-3.3-70b-versatile" # Sangat cepat & patuh pada skema Permendikbud 3/2021
    fallback_model: "qwen/qwen-2.5-72b-instruct"
    local_fallback: "ollama/qwen2.5:7b"
    reasoning_mode: "false" # Non-reasoning untuk pencegahan overthinking & kepatuhan format
    temperature: 0.1
    context_window: 131072
    toolsets:
      - "postgres_mcp"
      - "sqlite_mcp"
      - "google_workspace_mcp"
      - "playwright_headless"
      - "ripgrep"
      - "hermes_peer"

  kreator-humas:
    model: "deepseek/deepseek-chat"
    fallback_model: "groq/llama-3.3-70b-versatile"
    reasoning_mode: "hybrid"
    temperature: 0.7
    toolsets:
      - "image_generation"
      - "tts_synthesis"
      - "playwright_renderer"
      - "cron_scheduler"
      - "hermes_peer"

  sekretaris-rapat:
    model: "groq/llama-3.3-70b-versatile" # Ekstraksi notula instan
    audio_transcription_model: "groq/whisper-large-v3" # Transkripsi audio Telegram super cepat
    fallback_model: "deepseek/deepseek-chat"
    reasoning_mode: "false"
    temperature: 0.2
    context_window: 131072
    toolsets:
      - "whisper_stt"
      - "hermes_kanban"
      - "telegram_reminders"
      - "hermes_peer"

  mitra-pegawai:
    model: "groq/llama-3.3-70b-versatile" # Respon helpdesk <2 detik
    fallback_model: "deepseek/deepseek-chat"
    local_fallback: "ollama/gemma2:9b"
    reasoning_mode: "false"
    temperature: 0.3
    context_window: 65536
    toolsets:
      - "bge_m3_vector_retriever"
      - "sqlite_fts5"
      - "telegram_escalation"
      - "hermes_peer"

# Penyimpanan Persistensi & Database
storage:
  database_type: "postgresql"
  connection_uri: "${HERMES_DATABASE_URL}"
  sqlite_state_file: "~/.hermes/state.db"
  checkpointer: "PostgreSQLCheckpointer"
  session_persistence: true

# Konfigurasi Gateway Komunikasi Utama: Telegram Bot
gateway:
  channel: "telegram"
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    polling_mode: true # Ubah ke false dan isi webhook_url jika menggunakan webhook di VPS
    webhook_url: "${TELEGRAM_WEBHOOK_URL}"
    max_file_size_mb: 50
    default_commands:
      - command: "start"
        description: "Membuka sambutan & menu utama Dr. Fatimah"
      - command: "modul"
        description: "Rancang Modul Ajar SD/MI Kurikulum Merdeka (Fase A-C)"
      - command: "surat"
        description: "Buat draf surat dinas resmi Permendikbud No. 3/2021"
      - command: "notula"
        description: "Kirim rekaman suara rapat KKG/Dewan Guru untuk notula"
      - command: "refleksi_pmm"
        description: "Panduan refleksi kinerja guru kelas di Ruang GTK/PMM"
      - command: "status_kanban"
        description: "Lihat status tugas dan proyek sekolah di Kanban"
    approval_notifications:
      target_role: "Kepala Sekolah"
      enable_inline_buttons: true

# Pengamanan Kontainer & Sandbox (Security Hardening)
security:
  cap_drop_all: true
  allowed_capabilities:
    - "DAC_OVERRIDE"
    - "CHOWN"
    - "FOWNER"
  no_new_privileges: true
  pids_limit: 256
  tmpfs_mounts:
    "/tmp": "size=512M"
    "/var/tmp": "size=256M"
    "/run": "size=64M"
